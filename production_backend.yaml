services:
  # ==========================================
  # SERVICIO DEL BACKEND (Django + FastAPI)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    restart: always
    # Redirige el puerto 8000 del contenedor al 8000 de tu máquina local
    # Mapeo de volúmenes para desarrollo (permite recarga en vivo sin reinstalar dependencias)
    expose:
      - 8000
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    networks:
      - shared_net


networks:
  shared_net:
    external: true
