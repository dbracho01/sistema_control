<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Sistema ART</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .clientes-container {
            max-width: 1400px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .form-section {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .form-section h3 {
            color: var(--dark);
            font-size: 1.1em;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .form-field {
            display: flex;
            flex-direction: column;
        }
        
        .form-field label {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        
        .form-field textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn-guardar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-guardar:hover {
            background: #1d4ed8;
        }
        
        .btn-cancelar {
            background: transparent;
            color: var(--gray);
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-cancelar:hover {
            background: var(--light);
            border-color: var(--gray);
        }
        
        /* ===== ESTILOS BASE PARA BOTONES DE ACCIÓN ===== */
        .btn-accion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin: 0 4px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        /* Botón Ver */
        .btn-accion.ver {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-accion.ver:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(59,130,246,0.3);
        }

        /* Botón Editar */
        .btn-accion.editar {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-accion.editar:hover {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(245,158,11,0.3);
        }

        /* Botón Eliminar */
        .btn-accion.eliminar {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-accion.eliminar:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(239,68,68,0.3);
        }

        /* Efecto de clic */
        .btn-accion:active {
            transform: translateY(1px);
        }
        
        .table-container {
            margin-top: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: var(--light);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: var(--gray);
        }
        
        .activo-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        
        .activo-si {
            background: #10b98120;
            color: #10b981;
        }
        
        .activo-no {
            background: #ef444420;
            color: #ef4444;
        }
        
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .pagination-info {
            font-size: 13px;
            color: var(--gray);
        }
        
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .pagination-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination-numbers {
            display: flex;
            gap: 5px;
        }
        
        .pagination-number {
            background: white;
            border: 1px solid #ddd;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .pagination-number.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Logo fijo en esquina superior izquierda */
        .logo-header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 8px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .logo-header-img {
            height: 35px;
            width: auto;
            display: block;
        }
        
        .acciones {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
   
   <script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }
</script>
<script src="validar_permisos.js"></script>
<script>
    const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
    const tienePermiso = usuario.permisos?.clientes || usuario.username === 'admin';
    
    if (!tienePermiso) {
        // Redirigir al primer módulo disponible sin alert
        if (usuario.permisos?.cotizaciones) {
            window.location.href = 'cotizaciones.html';
        } else if (usuario.permisos?.productos) {
            window.location.href = 'productos.html';
        } else if (usuario.permisos?.cronograma) {
            window.location.href = 'index.html';
        } else if (usuario.permisos?.reportes) {
            window.location.href = 'reportes.html';
        } else if (usuario.permisos?.propuestas) {
            window.location.href = 'propuestas.html';
        }
        // Si no tiene ningún permiso, no hace nada (página en blanco)
    } else {
        initPage('clientes');
    }
</script>
    
    <div class="login-container">
        ...

    <div class="logo-header">
        <img src="/assets/logo.png" alt="Logo" class="logo-header-img">
    </div>

    <div class="app-container">
        <div class="main-content">
            <div class="tabs">
                <button class="tab" onclick="window.location.href='index.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Cronograma
                </button>
                <button class="tab" onclick="window.location.href='reportes.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" style="margin-right: 8px; vertical-align: middle;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                        <path d="M14 2v6h6"/>
                        <rect x="8" y="12" width="8" height="2" rx="1" fill="currentColor"/>
                        <rect x="8" y="15" width="8" height="2" rx="1" fill="currentColor"/>
                        <circle cx="17" cy="18" r="1.5" fill="currentColor"/>
                    </svg>
                    Reportes
                </button>
                <button class="tab" onclick="window.location.href='cotizaciones.html'">💰 Cotizaciones</button>
                <button class="tab active" onclick="window.location.href='clientes.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Clientes
                </button>
                <button class="tab" onclick="window.location.href='productos.html'">📦 Productos</button>
                <button class="tab" onclick="window.location.href='propuestas.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;">
                        <path d="M4 4h16v16H4z"/>
                        <line x1="8" y1="8" x2="16" y2="8"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                        <line x1="8" y1="16" x2="12" y2="16"/>
                        <circle cx="17" cy="17" r="2" fill="currentColor"/>
                    </svg>
                    Propuestas
                </button>
            </div>

            <div class="clientes-container">
                <h2 style="margin-top: 0; color: var(--dark);">Gestión de Clientes</h2>
                
                <form id="clienteForm">
                    <div class="form-section">
                        <h3>Información del Cliente</h3>
                        <div class="form-grid">
                            <div class="form-field">
                                <label>Nombre *</label>
                                <input type="text" id="nombre" required placeholder="Nombre completo">
                            </div>
                            <div class="form-field">
                                <label>Identificación</label>
                                <input type="text" id="identificacion" placeholder="NIT / Cédula">
                            </div>
                            <div class="form-field">
                                <label>Email</label>
                                <input type="email" id="email" placeholder="correo@ejemplo.com">
                            </div>
                            <div class="form-field">
                                <label>Teléfono</label>
                                <input type="text" id="telefono" placeholder="Teléfono de contacto">
                            </div>
                            <div class="form-field">
                                <label>Dirección</label>
                                <input type="text" id="direccion" placeholder="Dirección">
                            </div>
                            <div class="form-field">
                                <label>Ciudad</label>
                                <input type="text" id="ciudad" placeholder="Ciudad">
                            </div>
                            <div class="form-field">
                                <label>Persona de Contacto</label>
                                <input type="text" id="contacto" placeholder="Nombre del contacto">
                            </div>
                            <div class="form-field">
                                <label>Asignado a (Comercial)</label>
                                <input type="text" id="asignado_a" placeholder="Nombre del vendedor">
                            </div>
                            <div class="form-field">
                                <label>Estado</label>
                                <select id="activo">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>
                            <div class="form-field full-width">
                                <label>Notas</label>
                                <textarea id="notas" rows="3" placeholder="Observaciones adicionales..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="acciones">
                        <button type="button" class="btn-cancelar" onclick="limpiarFormulario()">Cancelar</button>
                        <button type="submit" class="btn-guardar">💾 Guardar Cliente</button>
                    </div>
                </form>

                <div class="table-container">
                    <h3>Clientes Registrados</h3>
                    <table id="clientesTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Identificación</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Ciudad</th>
                                <th>Contacto</th>
                                <th>Asignado a</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientesBody">
                            <tr><td colspan="10" class="loading">Cargando clientes......</td></tr>
                        </tbody>
                    </table>
                    
                    <div class="pagination-container">
                        <div class="pagination-info" id="paginationInfo">Mostrando 0-0 de 0 clientes</div>
                        <div class="pagination-controls" id="paginationControls">
                            <button class="pagination-btn" id="prevPage" disabled>◀ Anterior</button>
                            <div class="pagination-numbers" id="paginationNumbers"></div>
                            <button class="pagination-btn" id="nextPage" disabled>Siguiente ▶</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver detalles del cliente -->
    <div id="detalleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalles del Cliente</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body" id="detalleBody">
                <div class="loading">Cargando detalles...</div>
            </div>
        </div>
    </div>

    <script src="clientes.js"></script>
</body>
</html>
